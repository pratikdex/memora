version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: memora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: memora_secret
      POSTGRES_DB: memora_db
    ports:
      - '5432:5432'
    volumes:
      - memora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U memora -d memora_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  memora_pgdata:
    driver: local
